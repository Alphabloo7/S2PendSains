services:
  web:
    image: alphabloo7/s2-pend-sains:latest
    container_name: s2-pend-sains-web
    restart: always
    ports:
      - "8089:80" # Ubah port 8089 jika port tersebut sudah terpakai di server VPS Anda
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
